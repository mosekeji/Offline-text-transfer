name: 打包并发布 Release

# 推 v* 标签时自动打包两个项目并创建 Release；
# 也可以在 Actions 页面手动触发（需要填入已存在的 tag）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（需为已存在的 tag，例如 v1.0.0）'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包两个项目
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          zip -rq "dist/offline-text-transfer-html-web-${TAG}.zip" html-web -x '*.DS_Store'
          zip -rq "dist/offline-text-transfer-wechat-miniprogram-${TAG}.zip" wechat-miniprogram -x '*.DS_Store'
          ls -lh dist

      - name: 生成 Release 说明
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          cat > NOTES.md <<EOF
          ## ${TAG} · 文本离线传输工具

          一个完全离线的文本传输工具：把文字变成二维码，或把二维码还原成文字。
          所有处理都在本机完成，不联网、不上传，断网、内网、飞行模式下都能正常使用。

          ### 本版本附件

          | 附件 | 对应端 | 用法 |
          | --- | --- | --- |
          | \`offline-text-transfer-html-web-${TAG}.zip\` | PC / 浏览器 | 解压后双击 \`offline-qr-transfer.html\` 即可使用 |
          | \`offline-text-transfer-wechat-miniprogram-${TAG}.zip\` | 手机 / 微信 | 用微信开发者工具「导入项目」，目录选 \`wechat-miniprogram\` |

          ### 主要特性

          - 完全离线：不联网、不上传，断网 / 内网 / 飞行模式下可用
          - 文字 ⇄ 二维码双向转换，两端二维码格式完全兼容，可互相传输
          - 网页版：单文件 HTML，内嵌 ZXing WebAssembly 识别引擎，双击即用
          - 小程序版：自研纯 JS 二维码编码器（零依赖），原生扫码，含历史记录与「关于」使用说明

          详细说明见仓库 README。
          EOF
          echo "--- NOTES.md ---"
          cat NOTES.md

      - name: 创建 Release 并上传附件
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传附件"
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "${TAG} · 文本离线传输工具" \
              --notes-file NOTES.md
          fi
          echo "=== 完成，当前附件 ==="
          gh release view "$TAG" --json tagName,name,assets \
            --template '{{.name}}\n{{range .assets}}  - {{.name}} ({{.size}} bytes)\n{{end}}'
